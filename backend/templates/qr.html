<!doctype html>
<html lang="en" data-mode="{{MODE}}" data-frontend="wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* The PC's Home screen.
     night  just the wallpaper, dimmed right down — no clock, no QR, so the
            screen gives off as little light as possible
     live   wallpaper, lock-screen clock and the QR code at full brightness */
  :root {
    --font: "Outfit", -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    --wall-opacity: 0.38;
    --shade: rgba(0, 0, 0, 0.45);
    --time: rgba(255, 255, 255, 0.42);
    --date: rgba(255, 255, 255, 0.34);
    --qr-dim: 0.55;
  }
  [data-mode="live"] {
    --wall-opacity: 1;
    --shade: rgba(0, 0, 0, 0.1);
    --time: rgba(255, 255, 255, 0.96);
    --date: rgba(255, 255, 255, 0.85);
    --qr-dim: 1;
  }

  /* Dark mode shows the wallpaper and nothing else: the clock and the QR
     code fade away, and return when Live is picked on the phone. */
  .clock,
  .qr,
  .qr-wait {
    transition: opacity 1s ease, visibility 0s linear 1s;
  }
  [data-mode="night"] .clock,
  [data-mode="night"] .qr,
  [data-mode="night"] .qr-wait {
    opacity: 0;
    visibility: hidden;
  }

  /* The QR code only shows once the phone page is up (it isn't while the
     remote starts, or rebuilds after an update); until then a loader holds
     its place, so nobody scans a code that leads nowhere. */
  [data-frontend="wait"] .qr,
  [data-frontend="ready"] .qr-wait {
    opacity: 0;
    visibility: hidden;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: var(--font);
  }
  /* This page is watched from the sofa: the real pointer is never useful
     here. The ring script below stands in for it while the mouse moves. */
  body { cursor: none; }

  .wall {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: var(--wall-opacity);
    transition: opacity 1s ease;
  }
  .wall.fading { opacity: 0; }
  .shade {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(110% 70% at 50% 0%, rgba(0, 0, 0, 0.35), transparent 60%),
      var(--shade);
    transition: background 1s ease;
    pointer-events: none;
  }

  /* Lock-screen clock: just the text, thick, with a soft shadow so it reads
     over any wallpaper. */
  .clock {
    position: fixed;
    top: 7vh;
    left: 0;
    right: 0;
    text-align: center;
    user-select: none;
  }
  .date {
    font-size: clamp(16px, 2.6vmin, 30px);
    font-weight: 600;
    color: var(--date);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 2px 18px rgba(0, 0, 0, 0.35);
    transition: color 1s ease;
  }
  .time {
    font-size: clamp(80px, 18vmin, 220px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    color: var(--time);
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35), 0 6px 40px rgba(0, 0, 0, 0.3);
    transition: color 1s ease;
  }

  /* The QR code alone, bottom-left. */
  .qr {
    position: fixed;
    left: 4vmin;
    bottom: 4vmin;
    padding: 0.9vmin;
    background: #fff;
    border-radius: 2.2vmin;
    line-height: 0;
    filter: brightness(var(--qr-dim));
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
    transition: filter 1s ease;
  }
  .qr svg {
    display: block;
    width: clamp(190px, 27vmin, 320px);
    height: auto;
  }

  .qr-wait {
    position: fixed;
    left: 4vmin;
    bottom: 4vmin;
    width: calc(clamp(190px, 27vmin, 320px) + 1.8vmin);
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2vmin;
    padding: 2vmin;
    border-radius: 2.2vmin;
    background: rgba(12, 14, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
    filter: brightness(var(--qr-dim));
    color: rgba(255, 255, 255, 0.9);
    text-align: center;
    user-select: none;
  }
  .spinner {
    width: clamp(44px, 6vmin, 72px);
    height: clamp(44px, 6vmin, 72px);
    border-radius: 50%;
    border: clamp(4px, 0.55vmin, 7px) solid rgba(255, 255, 255, 0.18);
    border-top-color: #fff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .qr-wait-title {
    font-size: clamp(16px, 2.2vmin, 26px);
    font-weight: 800;
  }
  .qr-wait-sub {
    margin-top: 0.6vmin;
    font-size: clamp(12px, 1.5vmin, 18px);
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.5s; }
  }
</style>
</head>
<body>
<video class="wall" id="wall" data-src="{{VIDEO}}" poster="{{POSTER}}" muted loop playsinline preload="none" aria-hidden="true"></video>
<div class="shade" aria-hidden="true"></div>

<div class="clock" aria-hidden="true">
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
</div>

<div class="qr" aria-label="Scan to open the phone remote">{{QR}}</div>
<div class="qr-wait" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <div>
    <div class="qr-wait-title" id="wait-title">Getting the remote ready</div>
    <div class="qr-wait-sub" id="wait-sub">The QR code appears in a moment</div>
  </div>
</div>

<script>
  // ---- Clock
  const timeEl = document.getElementById("time");
  const dateEl = document.getElementById("date");
  function tick() {
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/i, "");
    dateEl.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  }
  tick();
  setInterval(tick, 10000);

  // ---- Pointer: the page's cursor is hidden (TV screen), so a ring marks
  // where the mouse is while it moves and fades out 5 s after it stops.
  // Same look as warden.js in the app tabs.
  const ring = document.createElement("div");
  ring.setAttribute("aria-hidden", "true");
  ring.style.cssText =
    "position:fixed;z-index:2147483647;width:36px;height:36px;margin:-18px 0 0 -18px;" +
    "border:3px solid #fff;border-radius:50%;pointer-events:none;left:0;top:0;opacity:0;" +
    "box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 16px rgba(0,0,0,.5);transition:opacity .3s";
  document.body.appendChild(ring);
  let ringTimer;
  function showRing(e) {
    ring.style.left = e.clientX + "px";
    ring.style.top = e.clientY + "px";
    ring.style.opacity = "1";
    clearTimeout(ringTimer);
    ringTimer = setTimeout(() => { ring.style.opacity = "0"; }, 5000);
  }
  addEventListener("pointermove", showRing, { passive: true });
  addEventListener("pointerdown", showRing, { passive: true });

  // ---- Wallpaper: only plays while this tab is the one showing. When it's
  // hidden the video is unloaded entirely, so it holds no decoder or memory.
  const wall = document.getElementById("wall");
  function load() {
    const src = wall.dataset.src;
    if (!src) return;
    if (wall.getAttribute("src") !== src) wall.setAttribute("src", src);
    wall.play().catch(() => {});
  }
  function unload() {
    wall.pause();
    wall.removeAttribute("src");
    wall.load();
  }
  function onVisibility() {
    if (document.visibilityState === "visible") load();
    else unload();
  }
  document.addEventListener("visibilitychange", onVisibility);
  onVisibility();

  function swapVideo(src, poster) {
    if (!src || wall.dataset.src === src) return;
    wall.dataset.src = src;
    wall.setAttribute("poster", poster || "");
    if (document.visibilityState !== "visible") return;  // loads when shown
    wall.classList.add("fading");
    setTimeout(() => {
      load();
      wall.addEventListener("playing", () => wall.classList.remove("fading"), { once: true });
      setTimeout(() => wall.classList.remove("fading"), 4000);
    }, 600);
  }

  // ---- Follow the theme and wallpaper picked on the phone (only while shown).
  async function follow() {
    if (document.visibilityState !== "visible") return;
    try {
      const res = await fetch("/mode", { cache: "no-store" });
      const state = await res.json();
      if (state.mode && document.documentElement.dataset.mode !== state.mode) {
        document.documentElement.dataset.mode = state.mode;
      }
      if (state.wallpaper) swapVideo(state.wallpaper.video, state.wallpaper.poster);
    } catch (e) {}
  }
  setInterval(follow, 2500);

  // ---- Phone page status: show the QR code only while the phone page is
  // live. Checked often while waiting, then now and again (it goes away for a
  // few seconds when the remote updates).
  const waitTitle = document.getElementById("wait-title");
  const waitSub = document.getElementById("wait-sub");
  let frontendTimer;
  async function checkFrontend() {
    clearTimeout(frontendTimer);
    let ready = false;
    let backendUp = true;
    try {
      const res = await fetch("/frontend", { cache: "no-store" });
      ready = !!(await res.json()).ready;
    } catch (e) {
      backendUp = false;
    }
    document.documentElement.dataset.frontend = ready ? "ready" : "wait";
    if (!ready) {
      waitTitle.textContent = backendUp ? "Getting the remote ready" : "Restarting the remote";
      waitSub.textContent = "The QR code appears in a moment";
    }
    frontendTimer = setTimeout(checkFrontend, ready ? 5000 : 1500);
  }
  checkFrontend();
  wall.addEventListener("stalled", () => setTimeout(() => { if (document.visibilityState === "visible") wall.play().catch(() => {}); }, 2000));
</script>
</body>
</html>

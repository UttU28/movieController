<!doctype html>
<html lang="en" data-mode="{{MODE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote QR</title>
<style>
  /* Three looks for the idle screen, picked on the phone's power screen:
     day   light and clean
     night near-black and dim, for a dark room
     live  a slow, soft colour drift behind a glass card */
  :root {
    --bg: #f3f3f6;
    --card: #ffffff;
    --line: #e2e2e8;
    --text: #17171b;
    --muted: #5c5c66;
    --accent: #6d4bff;
    --qr-dim: 1;
    --shadow: 0 30px 80px rgba(20, 20, 40, 0.12);
  }
  [data-mode="night"] {
    --bg: #000;
    --card: #050505;
    --line: #111;
    --text: #6e6e74;
    --muted: #3c3c42;
    --accent: #3a3a44;
    --qr-dim: 0.55;
    --shadow: none;
  }
  [data-mode="live"] {
    --bg: #07070c;
    --card: rgba(18, 18, 28, 0.55);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e6e6ee;
    --muted: #8a8a99;
    --accent: #8b6dff;
    --qr-dim: 0.9;
    --shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: background 0.6s, color 0.6s;
  }

  /* Live: three blurred colour fields drifting very slowly. */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.8s;
    pointer-events: none;
  }
  [data-mode="live"] .aurora { opacity: 1; }
  .aurora span {
    position: absolute;
    width: 55vmax;
    height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    animation: drift 38s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1) { background: #6d4bff; left: 5%; top: 10%; }
  .aurora span:nth-child(2) { background: #00a4dc; right: 5%; top: 25%; animation-duration: 46s; animation-delay: -12s; }
  .aurora span:nth-child(3) { background: #e0336b; left: 30%; bottom: 0; animation-duration: 54s; animation-delay: -24s; opacity: 0.22; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(8vmax, -6vmax) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { .aurora span { animation: none; } }

  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* Clock: dim and large when idle (night / live), hidden in day. */
  .clock {
    display: none;
    font-weight: 200;
    font-size: clamp(56px, 11vmin, 132px);
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .date {
    display: none;
    margin-top: -12px;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  [data-mode="night"] .clock, [data-mode="live"] .clock,
  [data-mode="night"] .date, [data-mode="live"] .date { display: block; }

  .card {
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 22px 26px 22px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    transition: background 0.6s, border-color 0.6s, box-shadow 0.6s;
  }
  .qr {
    flex: none;
    background: #fff;
    padding: 10px;
    border-radius: 18px;
    line-height: 0;
    filter: brightness(var(--qr-dim));
    transition: filter 0.6s;
  }
  .qr svg {
    display: block;
    width: clamp(170px, 26vmin, 260px);
    height: auto;
  }
  .text {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 280px;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--muted);
  }
  .url {
    font: 600 0.9rem ui-monospace, Consolas, monospace;
    color: var(--text);
    opacity: 0.8;
    word-break: break-all;
  }
  [data-mode="night"] h1 { font-weight: 500; }

  @media (max-width: 640px) {
    .card { flex-direction: column; text-align: center; padding: 22px; }
    .text { align-items: center; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<main>
  <div class="stack">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <section class="card">
      <div class="qr">{{QR}}</div>
      <div class="text">
        <p class="eyebrow">Phone remote</p>
        <h1>Scan to control</h1>
        <p>Point your phone camera at the code. Same Wi-Fi as this PC.</p>
        <div class="url">{{URL}}</div>
      </div>
    </section>
  </div>
</main>
<script>
  // Clock (only visible in night / live).
  const clock = document.getElementById("clock");
  const date = document.getElementById("date");
  function tick() {
    const now = new Date();
    clock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    date.textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 15000);

  // Follow the theme picked on the phone, without reloading.
  async function followMode() {
    try {
      const res = await fetch("/mode", { cache: "no-store" });
      const { mode } = await res.json();
      if (mode && document.documentElement.dataset.mode !== mode) {
        document.documentElement.dataset.mode = mode;
      }
    } catch (e) {}
  }
  setInterval(followMode, 2500);
</script>
</body>
</html>
